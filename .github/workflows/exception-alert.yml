name: Exception Alert

# Manual-only trigger: this doesn't run on push/PR, only when someone clicks
# "Run workflow" in the Actions tab (or fires it via `gh workflow run`) and
# fills in the two inputs below.
on:
  workflow_dispatch:
    inputs:
      customer_name:
        description: 'Customer to check (matched case-insensitively against client_name)'
        required: true
        type: string
      alert_type:
        description: 'Which category of anomaly to prioritize'
        required: true
        type: choice
        default: general
        options:
          - general
          - overdue
          - duplicate
          - amount

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Runs the anomaly check and writes the structured alert to alerts/latest.json
      # so it can also be uploaded as a build artifact below.
      #
      # customer_name is free-text dispatch input, so it reaches the shell through
      # an environment variable rather than a ${{ }} expression: ${{ }} is
      # substituted before bash parses the script, which would let a quote in the
      # input close the string and run arbitrary commands in a job holding the
      # Anthropic API key. As "$CUSTOMER_NAME" it stays an ordinary argument.
      - name: Run exception check
        env:
          CUSTOMER_NAME: ${{ inputs.customer_name }}
          ALERT_TYPE: ${{ inputs.alert_type }}
        run: |
          mkdir -p alerts
          python BOSS/exception_alert.py "$CUSTOMER_NAME" \
            --alert-type "$ALERT_TYPE" \
            --output alerts/latest.json

      # Renders the alert JSON straight into the workflow run's summary page, so
      # anyone who triggered the run can read the result without downloading
      # the artifact.
      - name: Write job summary
        if: always()
        env:
          CUSTOMER_NAME: ${{ inputs.customer_name }}
          ALERT_TYPE: ${{ inputs.alert_type }}
        run: |
          echo "### Exception Alert: $CUSTOMER_NAME ($ALERT_TYPE)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat alerts/latest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Artifact names can't contain "/", so slugify the customer name first
      # (tr swaps anything that isn't a letter/digit/dash/underscore for "-").
      - name: Slugify customer name for artifact naming
        id: slug
        env:
          CUSTOMER_NAME: ${{ inputs.customer_name }}
        run: echo "value=$(printf '%s' "$CUSTOMER_NAME" | tr -c 'A-Za-z0-9_-' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload alert artifact
        uses: actions/upload-artifact@v4
        with:
          name: exception-alert-${{ steps.slug.outputs.value }}
          path: alerts/latest.json
