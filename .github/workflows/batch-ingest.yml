name: Batch Importer

# Runs whenever a push adds/changes a file under incoming/ — e.g. dropping a
# new CSV export there and pushing it. `paths:` is a filter: GitHub still
# fires this workflow's push event for every push to master, but skips
# actually running the job unless at least one changed file matches.
on:
  push:
    branches: [master]
    paths:
      - 'incoming/**'
  workflow_dispatch:        # Manual trigger, e.g. to re-run against the last push while testing

# contents: write lets the "Open a PR with mapped JSON" step below push a
# new branch; pull-requests: write lets it open the PR. It can't push
# straight to master and skip the PR — master is a protected branch here
# (required "Run tests" status check, enforced even for admins/bots), so a
# direct `git push` to it is always rejected with GH006. Going through a PR
# is the way to add commits that still satisfies that protection.
permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 pulls the full history. The "Find new files" step below
      # diffs the entire push range (github.event.before..github.sha), and the
      # "before" commit can be arbitrarily far back when a push contains several
      # commits — a shallow fetch would leave it missing from the local clone.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Lists every spreadsheet under incoming/ that this run should map. The
      # grep keeps only spreadsheet files, in case a stray .gitkeep or README
      # lands in incoming/ too. The `<<EOF ... EOF` block is GitHub Actions' way
      # of passing a *multi-line* value out of a step via $GITHUB_OUTPUT.
      #
      # For a push, diff the whole push range rather than just its last commit:
      # a single push can contain several commits (and lands as a merge commit
      # when it comes from a PR), so `HEAD~1 HEAD` would only ever see the final
      # commit and silently skip CSVs added earlier in the same push.
      #
      # For a manual run — or any push whose "before" commit can't be resolved
      # (branch creation, force-push) — fall back to scanning for spreadsheets
      # that have no mapped output yet. Without that fallback a file missed by an
      # earlier failed run is skipped forever, since no later push touches it
      # again; re-running the workflow by hand had no way to pick it up.
      - name: Find new/changed files under incoming/
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          scan_unmapped() {
            find incoming -maxdepth 1 -type f \
              \( -iname '*.csv' -o -iname '*.xlsx' -o -iname '*.xls' \) -print \
              | sort | while IFS= read -r f; do
                  stem=$(basename "$f")
                  stem="${stem%.*}"
                  [ -e "data/${stem}.mapped.json" ] || printf '%s\n' "$f"
                done
          }

          if [ "$EVENT_NAME" = "push" ] \
             && [ -n "${BEFORE_SHA:-}" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # --diff-filter=d ignores deletions, so a removed CSV isn't handed to
            # the mapper as a path that no longer exists.
            FILES=$(git diff --name-only --diff-filter=d "$BEFORE_SHA" "$AFTER_SHA" -- incoming/ \
                    | grep -Ei '\.(csv|xlsx|xls)$' || true)
          else
            FILES=$(scan_unmapped)
          fi

          echo "Files to map:"
          echo "${FILES:-<none>}"

          {
            echo "files<<EOF"
            printf '%s\n' "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # BOSS/ingest.py normally writes its output next to the input file
      # (foo.csv -> foo.mapped.json); --output overrides that so results
      # land in data/ instead, one mapped JSON per file that changed.
      #
      # The file list is passed through the FILES environment variable rather
      # than interpolated as ${{ ... }} inside `run:`. A ${{ }} expression is
      # substituted into the script *before* bash parses it, so a filename
      # containing shell metacharacters would be executed as code — in a job
      # that holds contents: write and the Anthropic API key. Read via "$FILES"
      # the same content is only ever data.
      - name: Map each file and save to data/
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          mkdir -p data
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            name=$(basename "$file")
            stem="${name%.*}"
            python BOSS/ingest.py "$file" --output "data/${stem}.mapped.json"
          done <<< "$FILES"

      # Opens a PR instead of pushing straight to master (see the
      # `permissions:` comment above for why). `git diff --cached --quiet`
      # skips the rest entirely if mapping produced nothing new — no need
      # for an empty PR on a rerun. GH_TOKEN is what `gh pr create` reads
      # to authenticate; `github.token` is the same auto-issued token
      # `git push` implicitly uses via the checkout action's credential
      # helper, just made explicit here for the `gh` CLI's benefit.
      - name: Open a PR with mapped JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No mapped output changed — nothing to do."
            exit 0
          fi
          BRANCH="batch-ingest/$(date +'%Y-%m-%d-%H%M%S')"
          git checkout -b "$BRANCH"
          git commit -m "chore: batch-ingest mapped output $(date +'%Y-%m-%d')"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "Batch-ingest: mapped output $(date +'%Y-%m-%d')" \
            --body "Auto-generated by .github/workflows/batch-ingest.yml from new file(s) under incoming/."
